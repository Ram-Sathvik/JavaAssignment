<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Grocery Order</title>
    <link rel="stylesheet" href="grocery.css">
</head>
<body>
    <h1>Online Grocery Order</h1>
    <div class="container">
        <form action="#" method="POST">
            <fieldset>
                <legend>Customer Details</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required autofocus>

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="example@email.com" required>

                <label for="mobile">Mobile Number:</label>
                <input type="tel" id="mobile" placeholder="10-digit number" required>

                <label for="address">Delivery Address:</label>
                <input type="text" id="address" placeholder="Enter your delivery address" required>
            </fieldset>
            <fieldset>
                <legend>Order Details</legend>

                <p>Grocery Items:</p>
                <div class="checkbox">
                    <div class="item">
                        <label for="rice">Rice</label>
                        <input type="number" id="rice" min="0" max="10" value="0">
                    </div>
                    <div class="item">
                        <label for="milk">Milk</label>
                        <input type="number" id="milk" min="0" max="10" value="0">
                    </div>
                    <div class="item">
                        <label for="bread">Bread</label>
                        <input type="number" id="bread" min="0" max="10" value="0">
                    </div>
                    <div class="item">
                        <label for="eggs">Eggs</label>
                        <input type="number" id="eggs" min="0" max="10" value="0">
                    </div>
                    <div class="item">
                        <label for="sugar">Sugar</label>
                        <input type="number" id="sugar" min="0" max="10" value="0">
                    </div>
                </div>

                <label for="deliveryDate">Delivery Date:</label>
                <input type="date" id="deliveryDate" required>

                <label for="deliveryTime">Preferred Delivery Time:</label>
                <input type="time" id="deliveryTime">

                <p>Payment Method:</p>
                <div class="radio">
                    <div class="mode">
                        <input type="radio" id="cod" name="payment" required>
                        <label for="cod">Cash on Delivery</label>
                    </div>
                    <div class="mode">
                        <input type="radio" id="upi" name="payment">
                        <label for="upi">UPI</label>
                    </div>
                    <div class="mode">
                        <input type="radio" id="card" name="payment">
                        <label for="card">Card</label>
                    </div>
                </div>                  

                <label for="instructions">Special Instructions:</label>
                <textarea id="instructions" placeholder="Any specific delivery instructions..."></textarea>

                <div class="confirm">
                    <input type="checkbox" id="confirm" required>
                    <label for="confirm">I confirm my order</label>
                </div>
            </fieldset>
            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
