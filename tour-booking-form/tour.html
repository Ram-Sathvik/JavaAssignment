<!DOCTYPE html>
<html>
<head>
    <title>Tour Booking Form</title>
</head>
<body>
    <h2>Tour Booking Form</h2>

    <form id="bookingForm">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="destination">Destination:</label><br>
        <select id="destination" required>
            <option value="Ooty">Ooty</option>
            <option value="Goa">Goa</option>
            <option value="Manali">Manali</option>
        </select><br><br>

        <label for="days">Number of Days:</label><br>
        <input type="number" id="days" min="1" required><br><br>

        <label for="travelers">Number of Travelers:</label><br>
        <input type="number" id="travelers" min="1" required><br><br>

        <button type="button" onclick="bookTour()">Book Now</button>
  </form>

  <h3>Booking Summary:</h3>
  <div id="summary"></div>

  <script>
        function bookTour() {

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const destination = document.getElementById('destination').value;
            const days = parseInt(document.getElementById('days').value);
            const travelers = parseInt(document.getElementById('travelers').value);

            let pricePerDay = 0;

            if (destination === "Ooty") {
                pricePerDay = 2000;
            }
            else if (destination === "Goa") {
                pricePerDay = 3000;
            }
            else if (destination === "Manali") {
                pricePerDay = 4000;
            }

            const totalCost = pricePerDay * days * travelers;

            const summary = `
                <p>Name: ${name}</p>
                <p>Email: ${email}</p>
                <p>Destination: ${destination}</p>
                <p>Days: ${days}</p>
                <p>Travelers: ${travelers}</p>
                <p>Total Price: ₹${totalCost.toLocaleString()}</p>
            `;

            document.getElementById('summary').innerHTML = summary;
    }
  </script>
</body>
</html>
