<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let books = [
            {
                title: "JavaScript Basics",
                author: "Anu",
                price: 450,
                available: true
            },
            {
                title: "HTML & CSS",
                author: "Devi",
                price: 350,
                available: false
            }
        ];

        document.write("All Books: ");
        document.write(`<br>`);
        for (let book of books) {
            document.write(`Title: ${book.title}, Author: ${book.author}, Price: Rs.${book.price}, Available: ${book.available}`);
            document.write(`<br>`);
        }
        document.write(`<br>`);

        document.write("\nAvailable Books:");
        document.write(`<br>`);
        for (let book of books) {
            if (book.available) {
                document.write(`Title: ${book.title}, Author: ${book.author}, Price: Rs.${book.price}`);
                document.write(`<br>`);
            }
        }
        document.write(`<br>`);

        const newBook = {
            title: "Node.js Guide",
            author: "Kiran",
            price: 500,
            available: true
        };
        books.push(newBook);

        document.write("\nAfter Adding:");
        document.write(`<br>`);
        for (let book of books) {
            document.write(book.title);
            document.write(`<br>`);
        }
        document.write(`<br>`);

        for (let book of books) {
            if (book.title === "JavaScript Basics") {
                book.price = 500;
            }
        }

        document.write("\nAfter Price Update:");
        for (let book of books) {
            if (book.title === "JavaScript Basics") {
                document.write(`${book.title} - Rs.${book.price}`);
                document.write(`<br>`);
            }
        }
        books = books.filter(book => book.title !== "HTML & CSS");
        document.write(`<br>`);

        document.write("\nAfter Deletion:");
        document.write(`<br>`);
        for (let book of books) {
            document.write(book.title);
            document.write(`<br>`);
        }
    </script>
</body>
</html>
