<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Pooja Store - Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        
        <a class="navbar-brand fw-bold" href="#">Online Pooja Store</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            
            <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
            </li>
            
            <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="productsDropdown" role="button" data-bs-toggle="dropdown">
                Products
            </a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Pooja Kits</a></li>
                <li><a class="dropdown-item" href="#">Idols</a></li>
                <li><a class="dropdown-item" href="#">Flowers</a></li>
                <li><a class="dropdown-item" href="#">Incense Sticks</a></li>
            </ul>
            </li>
            
            <li class="nav-item">
            <a class="nav-link" href="#">Offers</a>
            </li>
            
            <li class="nav-item">
            <a class="nav-link" href="#">Cart</a>
            </li>
            
            <li class="nav-item">
            <a class="nav-link" href="#">Contact Us</a>
            </li>
            
        </ul>
        
        <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Search products" aria-label="Search">
            <button class="btn bg-light " type="submit">Search</button>
        </form>
        
        </div>
    </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
