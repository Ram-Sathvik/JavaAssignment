<!DOCTYPE html>
<html>
<head><title>Select Product</title></head>
<body>
    <h2>Select a Product</h2>
    <form action="quantity" method="post">
        <label>Select Product:</label>
        <select name="product">
            <option value="pen:10">Pen : 10Rs</option>
            <option value="notebook:50">Notebook : 50Rs</option>
            <option value="bag:500">Bag : 500Rs</option>
        </select><br><br>
        <input type="submit" value="Next">
    </form>
</body>
</html>
