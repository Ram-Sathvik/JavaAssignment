<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Calculator</title>
</head>
<body>
    <script>

    let fullName = prompt("Enter Full Name: ");

    let pan;
    do {
        pan = prompt("Enter PAN Number (10 characters): ");
    } while (pan.length !== 10);

    let dob = prompt("Enter Date of Birth (YYYY-MM-DD): ");
    let birthDate = new Date(dob);

    let today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    let m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }

    let income = parseFloat(prompt("Enter Annual Income: "));

    let tax = 0;
    if (income <= 250000) {
        tax = 0;
    }
    else if (income <= 500000) {
        tax = (income - 250000) * 0.05;
    }
    else if (income <= 1000000) {
        tax = (income - 500000) * 0.20;
    }
    else {
        tax = (income - 1000000) * 0.30;
    }

    tax = Math.round(tax);

    alert(
        "Name: " + fullName.toUpperCase() + "\n" +
        "PAN: " + pan.toUpperCase() + "\n" +
        "Age: " + age + " years\n" +
        "Annual Income: Rs. " + income + "\n" +
        "Calculated Tax: Rs. " + tax
    );
    </script>
</body>
</html>
